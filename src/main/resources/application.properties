server.port=8080

# Database Configuration (Defaults to MySQL with automatic DDL generation)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:traceflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:sagha/2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# TraceFlow Application Properties
traceflow.storage.upload-dir=./workspace/uploads
traceflow.ml.model-dir=./models
traceflow.ml.model-path=./models/bug_classifier.model
traceflow.ml.dataset-path=./models/bug_dataset.arff
traceflow.tracer.max-steps=500
traceflow.tracer.timeout-ms=5000

# Security & JWT
traceflow.jwt.secret=TraceFlowSecretKeyForJwtTokenGenerationAndOfflineVerification2026SecureKey123456!
traceflow.jwt.expiration-ms=86400000

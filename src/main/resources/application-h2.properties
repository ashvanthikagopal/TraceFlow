server.port=8080

spring.datasource.url=jdbc:h2:mem:traceflow_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

traceflow.storage.upload-dir=./workspace/uploads
traceflow.ml.model-dir=./models
traceflow.ml.model-path=./models/bug_classifier.model
traceflow.ml.dataset-path=./models/bug_dataset.arff
traceflow.tracer.max-steps=500
traceflow.tracer.timeout-ms=5000

traceflow.jwt.secret=TraceFlowSecretKeyForJwtTokenGenerationAndOfflineVerification2026SecureKey123456!
traceflow.jwt.expiration-ms=86400000

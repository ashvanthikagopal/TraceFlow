<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="tf-fav-cyan-blue" x1="32" y1="22" x2="74" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="tf-fav-violet-purple" x1="32" y1="98" x2="74" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="tf-fav-vertex" x1="52" y1="46" x2="78" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tf-fav-sheen" x1="36" y1="24" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="104" height="104" rx="30" fill="#ffffff" stroke="#e0e7ff" stroke-width="2" />

  <!-- Top Cyan-Blue Capsule -->
  <path
    d="M 31.5 35.5 
       C 26.5 30.5, 26.5 22.5, 31.5 17.5 
       C 36.5 12.5, 44.5 12.5, 49.5 17.5 
       L 79.5 47.5 
       C 84.5 52.5, 84.5 60.5, 79.5 65.5 
       C 74.5 70.5, 66.5 70.5, 61.5 65.5 
       Z"
    transform="translate(0, 4)"
    fill="url(#tf-fav-cyan-blue)"
  />

  <ellipse cx="40.5" cy="25.5" rx="5.5" ry="4" transform="rotate(-45 40.5 25.5)" fill="url(#tf-fav-sheen)" />

  <!-- Bottom Purple-Violet Capsule -->
  <path
    d="M 61.5 46.5 
       C 66.5 41.5, 74.5 41.5, 79.5 46.5 
       C 84.5 51.5, 84.5 59.5, 79.5 64.5 
       L 49.5 94.5 
       C 44.5 99.5, 36.5 99.5, 31.5 94.5 
       C 26.5 89.5, 26.5 81.5, 31.5 76.5 
       Z"
    transform="translate(0, 4)"
    fill="url(#tf-fav-violet-purple)"
  />

  <!-- Overlap Vertex Junction -->
  <path
    d="M 55 53 
       L 67 41 
       C 74.5 41.5, 84.5 51.5, 79.5 64.5 
       C 74.5 70.5, 66.5 70.5, 61.5 65.5 
       L 55 53 Z"
    transform="translate(0, 4)"
    fill="url(#tf-fav-vertex)"
  />
</svg>
